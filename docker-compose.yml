services:
  autobuild:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # build with the host's Docker daemon
      - ./autobuild.toml:/config/autobuild.toml:ro
      - autobuild-data:/data

volumes:
  autobuild-data:
