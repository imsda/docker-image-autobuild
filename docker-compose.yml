services:
  autobuild:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"   # only used if you enable webhooks during setup
    env_file:
      - path: .env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # build with the host's Docker daemon
      - ./config:/config                            # autobuild.toml + secrets, written by `init`
      - autobuild-data:/data

volumes:
  autobuild-data:
